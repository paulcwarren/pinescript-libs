<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Systematic Portfolio Rebalancer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
        
        <div class="bg-blue-900 text-white p-6">
            <h1 class="text-2xl font-bold mb-4">Weekly Portfolio Rebalance</h1>
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4 text-sm">
                <div>
                    <span class="text-blue-300 block">Regime</span>
                    <span class="font-bold text-lg" id="disp-regime">--</span>
                </div>
                <div>
                    <span class="text-blue-300 block">Target Lev</span>
                    <span class="font-bold text-lg" id="disp-lev">--</span>
                </div>
                <div>
                    <span class="text-blue-300 block">QQQ Price</span>
                    <span class="font-bold text-lg" id="disp-qqq">--</span>
                </div>
                <div>
                    <span class="text-blue-300 block">TQQQ Price</span>
                    <span class="font-bold text-lg" id="disp-tqqq">--</span>
                </div>
                <div>
                    <span class="text-blue-300 block"><span id="disp-hticker">Hedge</span> Price</span>
                    <span class="font-bold text-lg" id="disp-hedge">--</span>
                </div>
            </div>
        </div>

        <div class="p-6">
            <input type="hidden" id="sys-regime">
            <input type="hidden" id="sys-qqq-price">
            <input type="hidden" id="sys-hedge-price">
            <input type="hidden" id="sys-tqqq-price">

            <h2 class="text-lg font-bold text-gray-800 mb-4">Current Holdings</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="input-grid">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">QQQ Shares</label>
                    <input type="number" id="user-qqq-shares" placeholder="0" class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none" oninput="calculateTrades()">
                    <p class="text-xs text-gray-500 mt-1">Current shares owned</p>
                </div>
                
                <div id="tqqq-container">
                    <label class="block text-sm font-medium text-gray-700 mb-1">TQQQ Shares</label>
                    <input type="number" id="user-tqqq-shares" placeholder="0" class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none bg-blue-50" oninput="calculateTrades()">
                    <p class="text-xs text-gray-500 mt-1">Current shares owned</p>
                </div>

                <div>
                    <label id="input-hedge-label" class="block text-sm font-medium text-gray-700 mb-1">Hedge Shares</label>
                    <input type="number" id="user-hedge-shares" placeholder="0" class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none" oninput="calculateTrades()">
                    <p class="text-xs text-gray-500 mt-1">Current shares owned</p>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Cash ($)</label>
                    <input type="number" id="user-cash" placeholder="0" class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none" oninput="calculateTrades()">
                    <p class="text-xs text-gray-500 mt-1">Total cash available</p>
                </div>
            </div>

            <button onclick="calculateTrades()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 mb-8 shadow-sm">
                Calculate Required Trades
            </button>

            <div class="bg-gray-50 rounded-lg border border-gray-200 p-6">
                <div class="flex justify-between items-end border-b border-gray-200 pb-4 mb-4">
                    <h2 class="text-xl font-bold text-gray-800">Trade Instructions</h2>
                    <div class="text-right">
                        <span class="text-sm text-gray-500 block">Total Account Value</span>
                        <span class="text-2xl font-bold text-blue-900" id="user-total-value">$0.00</span>
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="flex justify-between items-center bg-white p-4 rounded border shadow-sm">
                        <span class="font-bold text-lg text-gray-700">QQQ</span>
                        <div id="qqq-result" class="text-lg">--</div>
                    </div>
                    
                    <div id="tqqq-result-row" class="flex justify-between items-center bg-white p-4 rounded border shadow-sm">
                        <span class="font-bold text-lg text-gray-700">TQQQ</span>
                        <div id="tqqq-result" class="text-lg">--</div>
                    </div>

                    <div class="flex justify-between items-center bg-white p-4 rounded border shadow-sm">
                        <span class="font-bold text-lg text-gray-700" id="hedge-result-label">Hedge</span>
                        <div id="hedge-result" class="text-lg">--</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Initialize App on Load
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // Populate hidden fields
            document.getElementById('sys-regime').value = urlParams.get('regime') || '';
            document.getElementById('sys-qqq-price').value = urlParams.get('qqq') || '';
            document.getElementById('sys-hedge-price').value = urlParams.get('hedge') || '';
            document.getElementById('sys-tqqq-price').value = urlParams.get('tqqq') || '';
            
            // Store the dynamic leverage target from Pine Script
            window.dynamicLev = parseFloat(urlParams.get('lev')) || 1.0;
            
            // Populate UI displays
            if(urlParams.get('regime')) document.getElementById('disp-regime').innerText = urlParams.get('regime');
            document.getElementById('disp-lev').innerText = window.dynamicLev.toFixed(2) + 'x';
            if(urlParams.get('qqq')) document.getElementById('disp-qqq').innerText = '$' + parseFloat(urlParams.get('qqq')).toFixed(2);
            if(urlParams.get('hedge')) document.getElementById('disp-hedge').innerText = '$' + parseFloat(urlParams.get('hedge')).toFixed(2);
            if(urlParams.get('tqqq')) document.getElementById('disp-tqqq').innerText = '$' + parseFloat(urlParams.get('tqqq')).toFixed(2);
            
            const hticker = urlParams.get('hticker');
            if(hticker) {
                document.getElementById('disp-hticker').innerText = hticker;
                document.getElementById('hedge-result-label').innerText = hticker;
                document.getElementById('input-hedge-label').innerText = hticker + ' Shares';
            }
            
            calculateTrades();
        };

        function calculateTrades() {
            const regime = parseInt(document.getElementById('sys-regime').value);
            const qqqPrice = parseFloat(document.getElementById('sys-qqq-price').value);
            const hedgePrice = parseFloat(document.getElementById('sys-hedge-price').value);
            const tqqqPrice = parseFloat(document.getElementById('sys-tqqq-price').value) || 0;

            if (isNaN(regime) || isNaN(qqqPrice) || isNaN(hedgePrice)) return; 

            const qqqShares = parseFloat(document.getElementById('user-qqq-shares').value) || 0;
            const hedgeShares = parseFloat(document.getElementById('user-hedge-shares').value) || 0;
            const tqqqShares = parseFloat(document.getElementById('user-tqqq-shares').value) || 0;
            const userCash = parseFloat(document.getElementById('user-cash').value) || 0;
            
            const totalValue = (qqqShares * qqqPrice) + (tqqqShares * tqqqPrice) + (hedgeShares * hedgePrice) + userCash;
            document.getElementById('user-total-value').innerText = '$' + totalValue.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

            if (totalValue <= 0) return;

            // Hybrid Strategy Logic
            let targetQValueWeight = 0;
            let targetHedgeWeight = 0;

            if (regime === 4) {
                targetQValueWeight = window.dynamicLev; // Use Vol-Targeted Leverage
                targetHedgeWeight = 0.00;
            } else {
                targetQValueWeight = 0.00; // Defensive posture for Regimes 0-3
                targetHedgeWeight = 1.00;  // 100% Hedge (DBMF)
            }

            let targetQqqValue = 0;
            let targetTqqqValue = 0;
            let targetHedgeValue = totalValue * targetHedgeWeight;

            // Cash-Blend TQQQ/QQQ Allocation Math
            if (targetQValueWeight > 0) {
                if (targetQValueWeight > 1.0) {
                    const weightTqqq = (targetQValueWeight - 1.0) / 2.0;
                    const weightQqq = 1.0 - weightTqqq;
                    targetTqqqValue = totalValue * weightTqqq;
                    targetQqqValue = totalValue * weightQqq;
                } else {
                    targetQqqValue = totalValue * targetQValueWeight;
                    targetTqqqValue = 0;
                }
            }

            const targetQqqShares = qqqPrice > 0 ? Math.floor(targetQqqValue / qqqPrice) : 0;
            const targetTqqqShares = tqqqPrice > 0 ? Math.floor(targetTqqqValue / tqqqPrice) : 0;
            const targetHedgeShares = hedgePrice > 0 ? Math.floor(targetHedgeValue / hedgePrice) : 0;

            const qqqTrade = targetQqqShares - qqqShares;
            const tqqqTrade = targetTqqqShares - tqqqShares;
            const hedgeTrade = targetHedgeShares - hedgeShares;

            function renderResult(elementId, tradeAmt, targetAmt) {
                const el = document.getElementById(elementId);
                if (!el) return;
                if (tradeAmt > 0) {
                    el.innerHTML = `<span class="text-green-600 font-bold">BUY ${tradeAmt}</span> <span class="text-sm text-gray-400 ml-2">(Target: ${targetAmt})</span>`;
                } else if (tradeAmt < 0) {
                    el.innerHTML = `<span class="text-red-500 font-bold">SELL ${Math.abs(tradeAmt)}</span> <span class="text-sm text-gray-400 ml-2">(Target: ${targetAmt})</span>`;
                } else {
                    el.innerHTML = `<span class="text-gray-400 font-bold">HOLD</span> <span class="text-sm text-gray-400 ml-2">(Target: ${targetAmt})</span>`;
                }
            }

            renderResult('qqq-result', qqqTrade, targetQqqShares);
            renderResult('tqqq-result', tqqqTrade, targetTqqqShares);
            renderResult('hedge-result', hedgeTrade, targetHedgeShares);
        }
    </script>
</body>
</html>
