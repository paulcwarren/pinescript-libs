name: Stock Scanner

on:
  workflow_dispatch:
  schedule:
    # Start at 20:15 UTC. The job waits until 1:15 PM
    # America/Los_Angeles, handling PST/PDT automatically.
    - cron: "15 20 * * 1-5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas yfinance plotly

      - name: Wait until 1:15 PM Pacific
        run: |
          python - <<'PY'
          from datetime import datetime
          from time import sleep
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("America/Los_Angeles")
          now = datetime.now(tz)
          target = now.replace(hour=13, minute=15, second=0, microsecond=0)

          if now < target:
              seconds = (target - now).total_seconds()
              print(f"Waiting {seconds:.0f} seconds until 1:15 PM Pacific")
              sleep(seconds)
          else:
              print("Already at or past 1:15 PM Pacific; continuing now")
          PY

      - name: Run stock scanner
        run: python scanners/run_scanner.py

      - name: Commit updated trigger page
        run: |
          if ! git status --porcelain -- scanners/triggers.html | grep -q .; then
            echo "No changes to scanners/triggers.html"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scanners/triggers.html
          git commit -m "Update stock scanner triggers"
          git push
